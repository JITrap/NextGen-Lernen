<!doctype html>
<html lang="de"><head><meta charset="utf-8"><title>ERB Motion</title>
<style>html,body{margin:0;background:#000;overflow:hidden}canvas{display:block}</style></head>
<body><canvas id="c" width="1920" height="1080"></canvas>
<script>
const W=1920,H=1080,FPS=30,DUR=98;
const Y='#FFED00',K='#121211',D='#0b0b0a',G='#8a8a86',WH='#f4f4f0';
const cv=document.getElementById('c'),X=cv.getContext('2d');
const buf=document.createElement('canvas');buf.width=W;buf.height=H;const B=buf.getContext('2d');

// ---------- utils ----------
const cl=(v,a=0,b=1)=>Math.max(a,Math.min(b,v));
const pr=(t,a,b)=>cl((t-a)/(b-a));
const eo=x=>1-Math.pow(1-x,4);
const ex=x=>x>=1?1:1-Math.pow(2,-10*x);
const eio=x=>x<.5?8*x*x*x*x:1-Math.pow(-2*x+2,4)/2;
const ei=x=>x*x*x;
const back=x=>{const c1=1.9,c3=c1+1;return 1+c3*Math.pow(x-1,3)+c1*Math.pow(x-1,2)};
const lerp=(a,b,t)=>a+(b-a)*t;
function rng(s){return()=>{s|=0;s=s+0x6D2B79F5|0;let t=Math.imul(s^s>>>15,1|s);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
const hash=n=>{const r=rng(n*9973+7);return r()};

const FONT={bc:'BC',in:'IN',mo:'MO'};
function font(c,f,size,w){c.font=`${w||800} ${size}px ${FONT[f]||f}`}
function txt(c,s,x,y,o={}){
  c.save();font(c,o.f||'bc',o.s||100,o.w);c.fillStyle=o.c||WH;c.textAlign=o.a||'left';c.textBaseline=o.b||'alphabetic';
  c.letterSpacing=(o.ls||0)+'px';c.globalAlpha*= (o.al==null?1:o.al);
  if(o.stroke){c.strokeStyle=o.stroke;c.lineWidth=o.lw||2;c.strokeText(s,x,y)}else c.fillText(s,x,y);
  c.restore();
}
function tw(c,s,f,size,w,ls=0){c.save();font(c,f,size,w);c.letterSpacing=ls+'px';const m=c.measureText(s).width;c.restore();return m}
// masked line reveal (text slides up from under a mask)
function rise(c,s,x,y,p,o={}){
  const sz=o.s||100;const e=eo(cl(p));
  c.save();c.beginPath();c.rect(x-(o.a==='center'?3000:o.a==='right'?6000:20),y-sz*1.05,6000,sz*1.35);c.clip();
  txt(c,s,x,y+(1-e)*sz*1.2,o);c.restore();
}
// slam: scale down + fade in
function slam(c,s,x,y,p,o={}){
  const e=eo(cl(p));const sc=lerp(o.from||1.35,1,e);
  c.save();c.translate(x,y);c.scale(sc,sc);c.globalAlpha*=cl(p*3);
  txt(c,s,0,0,Object.assign({},o,{a:o.a||'center',b:o.b||'middle'}));c.restore();
}
// per letter reveal
function letters(c,s,x,y,t,o={}){
  const sz=o.s||100;font(c,o.f||'bc',sz,o.w);
  let total=tw(c,s,o.f||'bc',sz,o.w,o.ls||0);let cx=o.a==='center'?x-total/2:x;
  for(let i=0;i<s.length;i++){
    const ch=s[i];const cw=tw(c,ch,o.f||'bc',sz,o.w,o.ls||0);
    const p=eo(pr(t,i*(o.st||.035),i*(o.st||.035)+(o.d||.45)));
    c.save();c.beginPath();c.rect(cx-5,y-sz*1.05,cw+10,sz*1.3);c.clip();
    txt(c,ch,cx,y+(1-p)*sz*1.1,Object.assign({},o,{a:'left'}));c.restore();cx+=cw;
  }
}
function rect(c,x,y,w,h,col,a=1){c.save();c.globalAlpha*=a;c.fillStyle=col;c.fillRect(x,y,w,h);c.restore()}
function imgCover(c,img,t,o={}){
  const z=(o.z0||1.08)+((o.z1||1.2)-(o.z0||1.08))*t;
  const s=Math.max(W/img.width,H/img.height)*z;
  const w=img.width*s,h=img.height*s;
  c.save();c.filter=o.filter||'grayscale(0.35) contrast(1.15) brightness(0.55)';
  c.drawImage(img,(W-w)/2+(o.dx||0)*t,(H-h)/2+(o.dy||0)*t,w,h);c.restore();
}
function grid(c,a,step=60,off=0){
  c.save();c.globalAlpha*=a;c.strokeStyle='rgba(255,255,255,.09)';c.lineWidth=1;c.beginPath();
  for(let x=-(off%step);x<W;x+=step){c.moveTo(x+.5,0);c.lineTo(x+.5,H)}
  for(let y=0;y<H;y+=step){c.moveTo(0,y+.5);c.lineTo(W,y+.5)}c.stroke();
  c.strokeStyle='rgba(255,237,0,.12)';c.beginPath();
  for(let x=-(off%(step*5));x<W;x+=step*5){c.moveTo(x+.5,0);c.lineTo(x+.5,H)}
  for(let y=0;y<H;y+=step*5){c.moveTo(0,y+.5);c.lineTo(W,y+.5)}c.stroke();c.restore();
}
function polyReveal(c,pts,p,col,lw,glow){
  // draw first p fraction of polyline length
  let L=0;const seg=[];for(let i=1;i<pts.length;i++){const l=Math.hypot(pts[i][0]-pts[i-1][0],pts[i][1]-pts[i-1][1]);seg.push(l);L+=l}
  let rem=L*cl(p);c.save();c.strokeStyle=col;c.lineWidth=lw;c.lineCap='round';c.lineJoin='round';
  if(glow){c.shadowColor=col;c.shadowBlur=glow}
  c.beginPath();c.moveTo(pts[0][0],pts[0][1]);let hx=pts[0][0],hy=pts[0][1];
  for(let i=1;i<pts.length&&rem>0;i++){const l=seg[i-1];const f=Math.min(1,rem/l);hx=lerp(pts[i-1][0],pts[i][0],f);hy=lerp(pts[i-1][1],pts[i][1],f);c.lineTo(hx,hy);rem-=l}
  c.stroke();c.restore();return [hx,hy];
}
function headGlow(c,x,y,r,col){c.save();const g=c.createRadialGradient(x,y,0,x,y,r);g.addColorStop(0,'rgba(255,255,255,1)');g.addColorStop(.15,col);g.addColorStop(1,'rgba(255,237,0,0)');c.fillStyle=g;c.beginPath();c.arc(x,y,r,0,7);c.fill();c.restore()}
function label(c,s,x,y,o={}){txt(c,s,x,y,Object.assign({f:'mo',s:22,w:500,c:G,ls:3},o))}
function bar(c,x,y,w,h,p,col=Y,dir=1){const e=eo(cl(p));if(dir>0)rect(c,x,y,w*e,h,col);else rect(c,x+w*(1-e),y,w*e,h,col)}
function numLabel(c,n,x,y,a=1){c.save();c.globalAlpha*=a;txt(c,n,x,y,{f:'mo',s:26,w:500,c:Y,ls:4});c.restore()}

// Logo mark (reconstruction): open double ring + ERB
function logo(c,cx,cy,sc,p,col=K,sub=true,subCol){
  c.save();c.translate(cx,cy);c.scale(sc,sc);
  const a0=0.30*Math.PI,a1=1.70*Math.PI; // opening to the right
  const p1=eio(pr(p,0,.45)),p2=eio(pr(p,.08,.53));
  c.strokeStyle=col;c.lineCap='butt';
  c.lineWidth=14;c.beginPath();c.arc(0,0,120,a1,a1-(a1-a0)*p1,true);c.stroke();
  c.lineWidth=9;c.beginPath();c.arc(0,0,92,a1,a1-(a1-a0)*p2,true);c.stroke();
  // ERB letters
  const lp=pr(p,.35,.8);
  c.save();c.beginPath();c.rect(-70,-80,420,160);c.clip();
  txt(c,'ERB',-52+(1-eo(lp))*-60,4,{s:150,w:800,c:col,b:'middle',ls:2,al:cl(lp*3)});c.restore();
  if(sub){const sp=pr(p,.6,1);
    c.save();c.beginPath();c.rect(-160,150,760,70);c.clip();
    txt(c,'Esslinger Rohrleitungsbau GmbH',-150,196+(1-eo(sp))*60,{f:'in',s:40,w:600,c:subCol||col});c.restore();}
  c.restore();
}

// icons
function iconFlame(c,x,y,s,col){c.save();c.translate(x,y);c.scale(s,s);c.fillStyle=col;c.beginPath();c.moveTo(0,-50);c.bezierCurveTo(30,-15,40,5,40,20);c.bezierCurveTo(40,45,20,55,0,55);c.bezierCurveTo(-20,55,-40,45,-40,20);c.bezierCurveTo(-40,0,-20,-10,-15,-30);c.bezierCurveTo(-5,-15,0,-10,5,-8);c.bezierCurveTo(8,-25,5,-40,0,-50);c.fill();c.restore()}
function iconDrop(c,x,y,s,col){c.save();c.translate(x,y);c.scale(s,s);c.fillStyle=col;c.beginPath();c.moveTo(0,-55);c.bezierCurveTo(20,-25,40,0,40,20);c.arc(0,20,40,0,Math.PI);c.bezierCurveTo(-40,0,-20,-25,0,-55);c.fill();c.restore()}
function iconHeat(c,x,y,s,col){c.save();c.translate(x,y);c.scale(s,s);c.strokeStyle=col;c.lineWidth=10;c.lineCap='round';for(let i=-1;i<=1;i++){c.beginPath();for(let k=0;k<=20;k++){const yy=-50+k*5;const xx=i*28+Math.sin(k/20*Math.PI*2)*10;k?c.lineTo(xx,yy):c.moveTo(xx,yy)}c.stroke()}c.restore()}

// sparks
function sparks(c,t,cx,cy,n,seed){
  c.save();c.globalCompositeOperation='lighter';
  for(let i=0;i<n;i++){
    const r=rng(seed+i*13);const born=r()*6;const life=.35+r()*.8;
    let age=(t-born)%6; if(age<0) age+=6; if(age>life) continue;
    const ang=-Math.PI*(0.05+r()*.9)+ (r()-.5)*.6;const sp=600+r()*1300;
    const x=cx+Math.cos(ang)*sp*age;const y=cy+Math.sin(ang)*sp*age+900*age*age;
    const vx=Math.cos(ang)*sp,vy=Math.sin(ang)*sp+1800*age;const vl=Math.hypot(vx,vy);
    const L=16+r()*20;const f=1-age/life;
    c.strokeStyle=`rgba(255,${200+r()*55|0},${90+r()*100|0},${f})`;c.lineWidth=2+r()*2;
    c.beginPath();c.moveTo(x,y);c.lineTo(x-vx/vl*L,y-vy/vl*L);c.stroke();
  }
  c.restore();
}

// pipe network (precomputed)
const NET=(()=>{const r=rng(42);const lines=[];
  for(let i=0;i<34;i++){let x=Math.round(r()*32)*60,y=Math.round(r()*18)*60;const pts=[[x,y]];let dir=r()<.5?0:1;
    for(let k=0;k<4+r()*5;k++){const len=(2+Math.floor(r()*7))*60;const sgn=r()<.5?-1:1;if(dir===0)x+=len*sgn;else y+=len*sgn;pts.push([x,y]);dir=1-dir}
    lines.push({pts,d:r()*1.4,sp:.9+r()*1.2,w:r()<.25?5:2})}
  return lines})();

// ---------- assets ----------
const IM={};
async function load(){
  const fonts=[['BC','bc-500',500],['BC','bc-700',700],['BC','bc-800',800],['BC','bc-900',900],['IN','inter-400',400],['IN','inter-600',600],['IN','inter-700',700],['MO','mono-500',500]];
  await Promise.all(fonts.map(async([fam,f,w])=>{const ff=new FontFace(fam,`url(fonts/${f}.woff2)`,{weight:String(w)});await ff.load();document.fonts.add(ff)}));
  const imgs={rohr:'header-rohrleitungsbau-01',heiz:'header-heizungsbau-01',bad:'header-badinstallation-01',verm:'header-vermietung-01',schw:'header-schweissfachhandel-01'};
  await Promise.all(Object.entries(imgs).map(([k,f])=>new Promise(res=>{const i=new Image();i.onload=()=>{IM[k]=i;res()};i.src=`img/${f}.jpg`})));
  // grain tiles
  IM.grain=[];for(let g=0;g<6;g++){const gc=document.createElement('canvas');gc.width=gc.height=256;const gx=gc.getContext('2d');const id=gx.createImageData(256,256);const r=rng(g+1);
    for(let i=0;i<id.data.length;i+=4){const v=r()*255|0;id.data[i]=id.data[i+1]=id.data[i+2]=v;id.data[i+3]=255}gx.putImageData(id,0,0);IM.grain.push(gx.createPattern(gc,'repeat'))}
}

// ---------- scenes ----------
// each: [start,end,fn(c,lt,t)]
const S=[];
const sc=(a,b,f,o={})=>S.push({a,b,f,o});

// 1 Intro 0-4
sc(0,4,(c,t)=>{
  rect(c,0,0,W,H,D);grid(c,pr(t,0,1.2)*.9,60,t*10);
  const pts=[[-20,860],[1280,860],[1280,300],[1960,300]];
  const [hx,hy]=polyReveal(c,pts,eio(pr(t,.2,3.6)),Y,10,25);
  if(t>.2&&t<3.7)headGlow(c,hx,hy,70,'rgba(255,237,0,.8)');
  label(c,'ESSLINGEN AM NECKAR',120,140,{al:pr(t,.3,.6)});
  label(c,'48.74° N  /  9.31° E',120,176,{al:pr(t,.5,.8),c:Y});
  const s1='UNTER DER STADT';letters(c,s1,120,560,t-1.2,{s:170,w:900,c:WH,st:.04});
  if(t>2.3)rise(c,'liegt, was sie am Leben hält.',124,640,pr(t,2.3,2.9),{f:'in',s:52,w:400,c:'#d9d9d4'});
  label(c,'ERB / 00',W-120,H-80,{a:'right',al:pr(t,.5,1)});
});

// 2 Word cuts 4-8
const WORDS=[['GAS.',Y,K,'MEDIUM 01'],['WASSER.',K,Y,'MEDIUM 02'],['WÄRME.',Y,K,'MEDIUM 03'],['100 BAR',null,WH,'DRUCKSTUFE'],['DN 1000',K,Y,'NENNWEITE'],['STAHL',WH,K,'WERKSTOFF'],['PE-HD',Y,K,'WERKSTOFF'],['GUSS',null,Y,'WERKSTOFF']];
sc(4,8,(c,t)=>{
  const i=Math.min(7,Math.floor(t/.5));const lt=t-i*.5;const [w,bg,fg,lab]=WORDS[i];
  if(bg)rect(c,0,0,W,H,bg);else{imgCover(c,i===3?IM.rohr:IM.verm,lt*2,{z0:1.3,z1:1.45,filter:'grayscale(1) contrast(1.3) brightness(0.35)'})}
  c.save();c.translate(W/2,H/2);c.scale(1+lt*.12,1+lt*.12);c.translate(-W/2,-H/2);
  slam(c,w,W/2,H/2+10,lt/.22,{s:330,w:900,c:fg,ls:4,from:1.5});c.restore();
  label(c,lab,120,140,{c:fg===K?K:fg,al:.8});label(c,'0'+(i+1)+' / 08',W-120,140,{a:'right',c:fg===K?K:fg,al:.8});
  // corner ticks
  c.save();c.strokeStyle=fg;c.lineWidth=3;c.globalAlpha=.7;[[80,80,1,1],[W-80,80,-1,1],[80,H-80,1,-1],[W-80,H-80,-1,-1]].forEach(([x,y,sx,sy])=>{c.beginPath();c.moveTo(x,y+30*sy);c.lineTo(x,y);c.lineTo(x+30*sx,y);c.stroke()});c.restore();
});

// 3 Network 8-12
sc(8,12,(c,t)=>{
  rect(c,0,0,W,H,D);grid(c,.6,60,t*30);
  c.save();c.translate(W/2,H/2);c.scale(1+t*.05,1+t*.05);c.translate(-W/2,-H/2);
  NET.forEach((l,i)=>{const p=eio(pr(t,l.d*.8,l.d*.8+1.4/l.sp));polyReveal(c,l.pts,p,i%3?'rgba(255,237,0,.55)':Y,l.w,l.w>3?18:0);
    if(p>=1){const e=l.pts[l.pts.length-1];c.save();c.fillStyle=Y;c.globalAlpha=.5+.5*Math.sin(t*8+i);c.fillRect(e[0]-7,e[1]-7,14,14);c.restore()}});
  c.restore();
  const bp=pr(t,.6,1.1);rect(c,0,H/2-150,W*eo(bp),300,'rgba(11,11,10,.88)');
  rise(c,'WIR BRINGEN ES DAHIN,',W/2,H/2-20,pr(t,.8,1.3),{s:120,w:900,a:'center',c:WH});
  rise(c,'WO ES HINGEHÖRT.',W/2,H/2+110,pr(t,1.1,1.6),{s:120,w:900,a:'center',c:Y});
});

// 4 Logo 12-16
sc(12,16,(c,t)=>{
  rect(c,0,0,W,H,Y);
  // expanding rings shockwave
  for(let k=0;k<3;k++){const p=pr(t,k*.12,1.2+k*.12);if(p>0&&p<1){c.save();c.strokeStyle=K;c.globalAlpha=(1-p)*.25;c.lineWidth=30*(1-p)+2;c.beginPath();c.arc(W/2-200,H/2-30,100+p*1300,0,7);c.stroke();c.restore()}}
  const s=1.55+t*.03;logo(c,W/2-330,H/2-40,s,pr(t,.05,1.7),K,true);
  label(c,'SEIT JAHRZEHNTEN IN ESSLINGEN',W/2,H-120,{a:'center',c:K,al:pr(t,1.8,2.3),ls:8});
});

// 5 Fünf Leistungen 16-20
const LEIST=['ROHRLEITUNGSBAU','HEIZUNGSBAU','SANITÄRINSTALLATION','MASCHINENVERMIETUNG','SCHWEISSFACHHANDEL'];
sc(16,20,(c,t)=>{
  rect(c,0,0,W,H,K);grid(c,.4);
  const n=Math.min(5,Math.floor(pr(t,.1,1.2)*5)+1);
  txt(c,'0'+n,150,700,{s:560,w:900,c:Y,al:1});
  rise(c,'LEISTUNGEN.',165,860,pr(t,.2,.6),{s:90,w:800,c:WH,ls:6});
  rise(c,'EIN PARTNER.',165,950,pr(t,.5,.9),{s:90,w:800,c:G,ls:6});
  LEIST.forEach((l,i)=>{const p=pr(t,.35+i*.28,.8+i*.28);const y=260+i*135;
    c.save();c.globalAlpha=cl(p*2);
    numLabel(c,'0'+(i+1),900+(1-eo(p))*200,y-40);
    txt(c,l,1000+(1-eo(p))*300,y,{s:92,w:800,c:WH});
    bar(c,1000,y+22,tw(c,l,'bc',92,800),4,pr(t,.6+i*.28,1.1+i*.28));c.restore()});
});

// Section title card helper
function sectionCard(c,t,num,title,img,sub,side=1){
  imgCover(c,img,t/6,{z0:1.1,z1:1.3,dx:-60*side});
  // yellow panel slides
  const p=eo(pr(t,0,.45));const pw=820;
  c.save();c.globalAlpha=.94;rect(c,side>0?-pw+pw*p:W-pw*p,0,pw,H,Y);c.restore();
  const x=side>0?-pw+pw*p:W-pw*p;
  c.save();c.beginPath();c.rect(x,0,pw,H);c.clip();
  txt(c,num,x+90,330,{s:300,w:900,c:K,al:.13});
  rise(c,num,x+95,300,pr(t,.2,.6),{f:'mo',s:34,w:500,c:K,ls:6});
  let yy=460;title.forEach((tl,i)=>{rise(c,tl,x+90,yy,pr(t,.28+i*.1,.75+i*.1),{s:tl.length>12?118:140,w:900,c:K});yy+= (tl.length>12?118:140)*.92});
  if(sub)sub.forEach((s,i)=>rise(c,s,x+94,yy+50+i*50,pr(t,.6+i*.1,1.1+i*.1),{f:'in',s:34,w:400,c:'#222'}));
  c.restore();
}

// 6 Rohrleitungsbau 20-30
sc(20,23,(c,t)=>sectionCard(c,t,'01',['ROHRLEITUNGS-','BAU'],IM.rohr,['Für den sicheren Transport fester,','flüssiger und gasförmiger Medien.']));
sc(23,25,(c,t)=>{ // gauge 100 bar
  rect(c,0,0,W,H,K);grid(c,.5);
  const cx=620,cy=600,R=330;const v=ex(pr(t,.05,1.3))*100;
  c.save();c.lineCap='butt';c.strokeStyle='#2a2a28';c.lineWidth=40;c.beginPath();c.arc(cx,cy,R,Math.PI*.75,Math.PI*2.25);c.stroke();
  c.strokeStyle=Y;c.shadowColor=Y;c.shadowBlur=30;c.beginPath();c.arc(cx,cy,R,Math.PI*.75,Math.PI*.75+Math.PI*1.5*v/100);c.stroke();c.restore();
  for(let i=0;i<=10;i++){const a=Math.PI*.75+Math.PI*1.5*i/10;c.save();c.strokeStyle=i*10<=v?Y:'#555';c.lineWidth=4;c.beginPath();c.moveTo(cx+Math.cos(a)*(R-60),cy+Math.sin(a)*(R-60));c.lineTo(cx+Math.cos(a)*(R-90),cy+Math.sin(a)*(R-90));c.stroke();c.restore()}
  const na=Math.PI*.75+Math.PI*1.5*v/100+Math.sin(t*40)*.01*(v>98?1:0);
  c.save();c.strokeStyle=WH;c.lineWidth=8;c.lineCap='round';c.beginPath();c.moveTo(cx,cy);c.lineTo(cx+Math.cos(na)*(R-110),cy+Math.sin(na)*(R-110));c.stroke();c.fillStyle=Y;c.beginPath();c.arc(cx,cy,22,0,7);c.fill();c.restore();
  txt(c,Math.round(v)+'',cx,cy+210,{s:120,w:900,c:WH,a:'center'});label(c,'BAR',cx,cy+255,{a:'center',c:Y});
  label(c,'GASVERSORGUNG',1120,330,{c:Y,al:pr(t,.1,.4)});
  rise(c,'BIS 100 BAR.',1115,480,pr(t,.2,.6),{s:150,w:900,c:WH});
  rise(c,'Gasleitungen in allen Nennweiten',1120,570,pr(t,.45,.9),{f:'in',s:38,w:400,c:'#cfcfca'});
  rise(c,'und Druckstufen – Guss, Stahl, PE-HD.',1120,620,pr(t,.55,1),{f:'in',s:38,w:400,c:'#cfcfca'});
  rise(c,'DVGW G1',1120,740,pr(t,.8,1.2),{f:'mo',s:30,w:500,c:Y,ls:5});
});
sc(25,27,(c,t)=>{ // DN 1000 cross-section

// ---------- cut FX ----------
const CUTS=S.map(s=>s.a).filter(a=>a>0);
// word-level micro cuts add glitch too
for(let i=1;i<8;i++)CUTS.push(4+i*.5);for(let i=1;i<12;i++)CUTS.push(56+i*.5);for(let i=1;i<4;i++)CUTS.push(64+i*3);for(let i=1;i<5;i++)CUTS.push(85+i*.8);
const IMPACTS=[4,12,16,20,23,25,27,30,36,42,48,51.5,54,56,64,76,82,90];
const FLASH=[12,20,54,82,90];

function renderFrame(t){
  const fr=Math.round(t*FPS);
  B.setTransform(1,0,0,1,0,0);B.globalAlpha=1;B.filter='none';B.globalCompositeOperation='source-over';
  B.clearRect(0,0,W,H);
  const s=S.find(s=>t>=s.a&&t<s.b)||S[S.length-1];
  B.save();s.f(B,t-s.a,t);B.restore();

  // shake
  let sh=0;IMPACTS.forEach(i=>{const d=t-i;if(d>=0&&d<.35)sh=Math.max(sh,(1-d/.35)*14)});
  const sx=(hash(fr)-.5)*2*sh,sy=(hash(fr+999)-.5)*2*sh;
  X.setTransform(1,0,0,1,0,0);X.globalAlpha=1;X.filter='none';X.globalCompositeOperation='source-over';
  X.fillStyle='#000';X.fillRect(0,0,W,H);
  const zs=1+sh*.002;X.setTransform(zs,0,0,zs,W/2*(1-zs)+sx,H/2*(1-zs)+sy);X.drawImage(buf,0,0);X.setTransform(1,0,0,1,0,0);

  // glitch slices near cuts
  let g=0;CUTS.forEach(ct=>{const d=t-ct;if(d>=0&&d<.1)g=Math.max(g,1-d/.1)});
  if(g>0){const r=rng(fr*31+5);for(let k=0;k<9;k++){const y=r()*H|0,h=(10+r()*90)|0,off=(r()-.5)*160*g;X.drawImage(buf,0,y,W,h,off,y,W,h)}
    X.save();X.globalCompositeOperation='screen';X.globalAlpha=.35*g;X.filter='sepia(1) saturate(8) hue-rotate(-50deg)';X.drawImage(buf,14*g,0);X.filter='sepia(1) saturate(8) hue-rotate(160deg)';X.drawImage(buf,-14*g,0);X.restore()}
  // flash
  FLASH.forEach(ft=>{const d=t-ft;if(d>=0&&d<.2){X.fillStyle=`rgba(255,255,245,${(1-d/.2)*.85})`;X.fillRect(0,0,W,H)}});
  // vignette
  const vg=X.createRadialGradient(W/2,H/2,H*.45,W/2,H/2,H*1.05);vg.addColorStop(0,'rgba(0,0,0,0)');vg.addColorStop(1,'rgba(0,0,0,.45)');X.fillStyle=vg;X.fillRect(0,0,W,H);
  // grain
  X.save();X.globalAlpha=.055;X.globalCompositeOperation='overlay';X.fillStyle=IM.grain[fr%6];X.translate((hash(fr)*256)|0,(hash(fr+3)*256)|0);X.fillRect(-256,-256,W+512,H+512);X.restore();
