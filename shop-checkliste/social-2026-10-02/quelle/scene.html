// ---------- math ----------

    const morph=eInOutCubic(1-inv(.35,1.0,te));
    let a=0,b=eInOutCubic(inv(.25,1.0,tl4));
    if(morph>0){const tgt=projectLine(L0);pts=pts.map((p,i)=>[lerp(p[0],tgt[i][0],morph),lerp(p[1],tgt[i][1],morph)]);a=lerp(0,GAP_A+breathe(t-D),morph);b=lerp(1,GAP_B-breathe(t-D),morph);}
    const op=inv(.25,.35,te);
    svgPath.setAttribute('d',pathFrom(pts));svgPath.setAttribute('stroke-width',(FN==='ogvid'?2.2:3.2).toFixed(1));
    svgPath.style.strokeDasharray=`${Math.max(0,b-a)} 2`;svgPath.style.strokeDashoffset=`${-a}`;svgPath.style.opacity=op;
  }else{ec.style.visibility='hidden';svgPath.style.opacity=0;}
  grainEl.style.backgroundPosition=`${Math.floor(rng(Math.round(t*30)+1)()*256)}px ${Math.floor(rng(Math.round(t*30)+7)()*256)}px`;
  await new Promise(r=>requestAnimationFrame(()=>requestAnimationFrame(r)));
  return true;
};

async function renderStill(){
  const sq=FN==='ogsq';
  const shot=sq?{x:0,y:Y0,k:790,yaw:5,sx:.5,sy:.445}:{x:0,y:Y0,k:600,yaw:7.5,sx:.5,sy:.432};
  applyShot(shot);
  for(const k in P)P[k].sheenAt(camera.position.x);
  L0.draw(GAP_A,GAP_B,1);
  scene.updateMatrixWorld(true);renderer.render(scene,camera);
  grainEl.style.backgroundPosition='0 0';
  await new Promise(r=>requestAnimationFrame(()=>requestAnimationFrame(r)));
  return true;
}
window.SCENE_READY=true;
